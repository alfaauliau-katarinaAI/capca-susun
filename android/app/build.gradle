plugins { id 'com.android.application' }
android {
  namespace 'ai.katarina.visionlab'
  compileSdk 35
  defaultConfig {
    applicationId 'ai.katarina.visionlab'
    minSdk 26
    targetSdk 35
    versionCode 8
    versionName '0.8.0'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
dependencies {
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
