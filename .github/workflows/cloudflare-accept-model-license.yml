name: Accept Meta Llama Vision License (manual only)
on:
  workflow_dispatch:
    inputs:
      i_accept_meta_license:
        description: "I read and accept Meta Llama 3.2 Vision Community License and Acceptable Use Policy"
        type: boolean
        required: true
        default: false
concurrency:
  group: visionlab-meta-license-accept
  cancel-in-progress: false
jobs:
  accept:
    if: inputs.i_accept_meta_license == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Confirm model agreement directly with Cloudflare
        run: |
          node <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!account||!token)throw new Error('Cloudflare credentials not configured');
          const url='https://api.cloudflare.com/client/v4/accounts/'+account+'/ai/run/@cf/meta/llama-3.2-11b-vision-instruct';
          const response=await fetch(url,{
            method:'POST',signal:AbortSignal.timeout(30000),
            headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
            body:JSON.stringify({prompt:'agree'})
          });
          const data=await response.json().catch(()=>({}));
          console.log('AGREEMENT_HTTP',response.status);
          console.log('AGREEMENT_SUCCESS',data.success===true);
          if(!response.ok||data.success!==true){
            console.log('AGREEMENT_ERROR_CODES',JSON.stringify((data.errors||[]).map(e=>e.code)));
            throw new Error('Cloudflare agreement request was rejected');
          }
          console.log('MODEL_LICENSE_ACCEPTED_BY_USER_INITIATED_WORKFLOW');
          NODE
