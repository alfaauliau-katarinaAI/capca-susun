name: Cloudflare Worker Unit Tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Workers AI mock tests
        run: npm test
