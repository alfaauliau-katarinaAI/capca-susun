name: Cloudflare Worker Unit Tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'cloudflare/**'
concurrency:
  group: visionlab-cloudflare-unit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Workers AI mock tests
        run: npm test
