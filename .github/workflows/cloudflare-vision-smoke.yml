name: Cloudflare AI Image Smoke Test
# Rerun after user confirmed model license acceptance 2026-10-17.
on:
  workflow_dispatch:
concurrency:
  group: visionlab-cloudflare-live-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      KATARINA_DEVICE_KEY: ${{ secrets.KATARINA_DEVICE_KEY }}
      KATARINA_BASE_URL: https://katarina-vision-lab.alfaaulia8.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Call live Cloudflare image AI with synthetic test image
        run: node .github/scripts/cloudflare-vision-smoke.mjs
