name: Deploy Cloudflare Vision Worker
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare-deploy
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KATARINA_DEVICE_KEY: ${{ secrets.KATARINA_DEVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare secrets are configured
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
          test -n "$KATARINA_DEVICE_KEY" || (echo 'Missing KATARINA_DEVICE_KEY' && exit 1)
          test "$(printf '%s' "$KATARINA_DEVICE_KEY" | wc -c)" -ge 24 || (echo 'Device Key too short' && exit 1)
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Validate Worker unit tests
        run: npm test
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Provision private Device Key
        run: printf '%s' "$KATARINA_DEVICE_KEY" | npx wrangler secret put APP_DEVICE_KEY
