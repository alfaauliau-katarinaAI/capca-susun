name: Katarina Telemetry One-Time Integration Test
on:
  push:
    paths:
      - '.github/workflows/katarina-telemetry-integration.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      KATARINA_DEVICE_KEY: ${{ secrets.KATARINA_DEVICE_KEY }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Roundtrip test — error report, storage and admin readback
        run: |
          node <<'NODE'
          const crypto=await import('node:crypto');
          const base='https://katarina-vision-lab.alfaaulia8.workers.dev';
          const key=process.env.KATARINA_DEVICE_KEY;
          if(!key||key.length<24)throw new Error('Device Key not configured');
          const admin=crypto.createHmac('sha256',key).update('katarina-diagnostics-admin-v1').digest('hex');
          const probe=async(path,opts={})=>{
            const response=await fetch(base+path,{...opts,signal:AbortSignal.timeout(25000)});
            const body=await response.json().catch(()=>({}));
            return {status:response.status,body};
          };
          const unauthorized=await probe('/v1/diagnostics-summary');
          if(unauthorized.status!==401)throw new Error('Private diagnostic endpoint is not protected');
          const payload={version:'0.6.0',android_api:30,events:['TEST_DIAGNOSTICS_ROUNDTRIP']};
          const submitted=await probe('/v1/telemetry',{
            method:'POST',headers:{'Content-Type':'application/json','X-Katarina-Key':key},
            body:JSON.stringify(payload)
          });
          console.log('TELEMETRY_POST_HTTP',submitted.status);
          if(submitted.status!==200||submitted.body.ok!==true)throw new Error('Telemetry POST failed: '+submitted.body.error);
          let latest;
          for(let i=0;i<4;i++){
            const view=await probe('/v1/diagnostics-summary',{headers:{'X-Katarina-Admin-Key':admin}});
            if(view.status!==200)throw new Error('Admin summary failed: '+view.body.error);
            latest=view.body;
            if((latest.counts?.TEST_DIAGNOSTICS_ROUNDTRIP||0)>=1)break;
            await new Promise(r=>setTimeout(r,1800));
          }
          if((latest?.counts?.TEST_DIAGNOSTICS_ROUNDTRIP||0)<1)throw new Error('Telemetry readback not visible');
          console.log('ROUNDTRIP_SUCCESS',true);
          console.log('ERROR_REPORTS_STORED',latest.reports);
          console.log('READBACK_PRIVATE',true);
          console.log('TTL_DAYS',latest.window_days);
          console.log('No user images, OCR values, credentials, IP addresses or account data used in test');
          NODE
